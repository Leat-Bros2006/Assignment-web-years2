<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="logos/png" href="../images/logos.png" />
    <title>Checkout</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/checkout.css">
</head>

<body>
    <div class="checkout-card">
        <h2>បង់ប្រាក់វគ្គសិក្សា</h2>
        <div class="course">
            <img id="courseImage" src="" alt="Course">
            <div>
                <h3 id="courseTitle"></h3>
                <p id="courseCategory"></p>
            </div>
        </div>
        <div class="price">
            <div class="row">
                <span>តម្លៃវគ្គ</span>
                <span id="coursePrice"></span>
            </div>
            <div class="row">
                <span>បញ្ចុះតម្លៃ</span>
                <span>$0</span>
            </div>
            <div class="row total">
                <span>សរុប</span>
                <span id="courseTotal"></span>
            </div>

        </div>

        <!-- payment -->
        <div class="payment-box">
            <h3>💳 ជ្រើសរើសការបង់ប្រាក់</h3>

            <p>ស្កេន QR Code ខាងក្រោម ដើម្បីបង់ប្រាក់</p>

            <img class="qr-image" src="../images//qr.png" alt="Payment QR">

            <p class="note">
                📌 សូមបង់ប្រាក់រួចចុចប៊ូតុងខាងក្រោម
            </p>
        </div>

        <button id="payBtn">
            បង់ប្រាក់ឥឡូវនេះ
        </button>

        <p id="message"></p>
    </div>
    <script type="module" src="../js/checkout.js"></script>
</body>

</html>
