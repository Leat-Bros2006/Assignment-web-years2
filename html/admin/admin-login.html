<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../../css/admin/admin.login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>🔐 Admin Login</h1>

            <p>សូម Login ដើម្បីចូលទៅកាន់ Admin</p>

            <form id="loginForm">

                <!-- Username -->
                <div class="form-group">
                    <label for="username">
                        Username
                    </label>

                    <input type="text" id="username" placeholder="បញ្ចូល Username">

                    <small id="usernameError"></small>
                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" placeholder="បញ្ចូល Password">

                    <small id="passwordError"></small>

                </div>


                <p id="loginError"></p>


                <button type="submit">
                    Login
                </button>

            </form>

        </div>

    </div>

    <script src="../../js/admin/admin-login.js"></script>

</body>

</html>
